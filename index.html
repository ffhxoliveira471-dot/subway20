<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Subway Surfers 3D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB; /* Cor do céu */
            font-family: 'Arial', sans-serif;
            touch-action: none; /* Evita rolagem no celular */
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            pointer-events: none;
        }
        #game-over {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 10;
        }
        #game-over h1 { font-size: 40px; margin-bottom: 10px; color: #ff4444; }
        #game-over p { font-size: 20px; margin-bottom: 20px; }
        .btn-restart {
            padding: 15px 30px;
            font-size: 20px;
            background: #00ffcc;
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        /* Controles Mobile na Tela */
        .mobile-controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            pointer-events: none;
        }
        .mobile-controls button {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            border: 2px solid white;
            font-size: 30px;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            user-select: none;
        }
        .mobile-controls button:active { background: rgba(255, 255, 255, 0.9); }
    </style>
    <!-- Importando a biblioteca 3D do navegador -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui">SCORE: <span id="score">0</span></div>

    <div id="game-over">
        <h1>GAME OVER</h1>
        <p>Sua pontuação: <span id="final-score">0</span></p>
        <button class="btn-restart" onclick="restartGame()">JOGAR NOVAMENTE</button>
    </div>

    <!-- Botões pro Celular -->
    <div class="mobile-controls">
        <button ontouchstart="moveLeft()">⬅️</button>
        <button ontouchstart="jump()">⬆️</button>
        <button ontouchstart="slide()">⬇️</button>
        <button ontouchstart="moveRight()">➡️</button>
    </div>

    <script>
        // Configuração Básica da Cena 3D
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 10, 80); // Névoa para esconder o fim do mapa

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 8);
        camera.lookAt(0, 2, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Iluminação
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(10, 20, 10);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));

        // Variáveis do Jogo
        let score = 0;
        let speed = 0.4;
        let isGameOver = false;
        let isJumping = false;
        let isSliding = false;
        let jumpVelocity = 0;
        let gravity = -0.02;
        let currentLane = 1; // 0 = Esq, 1 = Centro, 2 = Dir
        const laneWidth = 3;
        let obstacles = [];
        let coins = [];

        // Criar o Jogador (um Cubo Vermelho)
        const playerGeo = new THREE.BoxGeometry(1, 2, 1);
        const playerMat = new THREE.MeshLambertMaterial({ color: 0xff0000 });
        const player = new THREE.Mesh(playerGeo, playerMat);
        player.position.set(0, 1, 0);
        scene.add(player);

        // Criar os Trilhos/Chão
        const floorGeo = new THREE.PlaneGeometry(20, 200);
        const floorMat = new THREE.MeshLambertMaterial({ color: 0x555555 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.z = -50;
        scene.add(floor);

        // Criar as Linhas do Trilho (Visual)
        for (let i = 0; i < 3; i++) {
            const railGeo = new THREE.BoxGeometry(0.2, 0.1, 200);
            const railMat = new THREE.MeshLambertMaterial({ color: 0xaaaaaa });
            const rail = new THREE.Mesh(railGeo, railMat);
            rail.position.set((i - 1) * laneWidth, 0.05, -50);
            scene.add(rail);
        }

        // Funções de Controle
        function moveLeft() {
            if (currentLane > 0 && !isGameOver) currentLane--;
        }

        function moveRight() {
            if (currentLane < 2 && !isGameOver) currentLane++;
        }

        function jump() {
            if (!isJumping && !isGameOver) {
                isJumping = true;
                jumpVelocity = 0.4;
            }
        }

        function slide() {
            if (!isSliding && !isGameOver) {
                isSliding = true;
                player.scale.y = 0.5;
                player.position.y = 0.5;
                setTimeout(() => {
                    isSliding = false;
                    player.scale.y = 1;
                    player.position.y = 1;
                }, 800);
            }
        }

        // Controles de Teclado (PC)
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') moveLeft();
            if (e.key === 'ArrowRight' || e.key === 'd') moveRight();
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') jump();
            if (e.key === 'ArrowDown' || e.key === 's') slide();
        });

        // Controles de Swipe (Celular)
        let touchStartX = 0;
        let touchStartY = 0;
        window.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, {passive: true});

        window.addEventListener('touchend', (e) => {
            let touchEndX = e.changedTouches[0].screenX;
            let touchEndY = e.changedTouches[0].screenY;
            handleSwipe(touchStartX, touchStartY, touchEndX, touchEndY);
        }, {passive: true});

        function handleSwipe(startX, startY, endX, endY) {
            let diffX = endX - startX;
            let diffY = endY - startY;
            
            if (Math.abs(diffX) > Math.abs(diffY)) {
                // Swipe Horizontal
                if (diffX > 30) moveRight();
                else if (diffX < -30) moveLeft();
            } else {
                // Swipe Vertical
                if (diffY > 30) slide();
                else if (diffY < -30) jump();
            }
        }

        // Criar Trens e Moedas
        function spawnObstacle() {
            if (isGameOver) return;
            const lane = Math.floor(Math.random() * 3);
            const obsGeo = new THREE.BoxGeometry(2, 3, 4); // Trem
            const obsMat = new THREE.MeshLambertMaterial({ color: 0x0000ff }); // Azul
            const obstacle = new THREE.Mesh(obsGeo, obsMat);
            obstacle.position.set((lane - 1) * laneWidth, 1.5, -100);
            scene.add(obstacle);
            obstacles.push(obstacle);
        }

        function spawnCoin() {
            if (isGameOver) return;
            const lane = Math.floor(Math.random() * 3);
            const coinGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.2, 16);
            const coinMat = new THREE.MeshLambertMaterial({ color: 0xffd700 }); // Dourado
            const coin = new THREE.Mesh(coinGeo, coinMat);
            coin.rotation.x = Math.PI / 2;
            coin.position.set((lane - 1) * laneWidth, 1, -100);
            scene.add(coin);
            coins.push(coin);
        }

        // Loop Principal do Jogo
        function animate() {
            requestAnimationFrame(animate);

            if (!isGameOver) {
                score += 1;
                document.getElementById('score').innerText = Math.floor(score / 10);
                
                // Aumenta a velocidade com o tempo
                if (score % 500 === 0) speed += 0.05;

                // Pular (Física)
                if (isJumping) {
                    player.position.y += jumpVelocity;
                    jumpVelocity += gravity;
                    if (player.position.y <= 1) {
                        player.position.y = 1;
                        isJumping = false;
                    }
                }

                // Mover o jogador para a pista correta
                const targetX = (currentLane - 1) * laneWidth;
                player.position.x += (targetX - player.position.x) * 0.2; // Suavização

                // Mover os obstáculos
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i];
                    obs.position.z += speed;
                    
                    // Colisão Simples
                    if (Math.abs(obs.position.x - player.position.x) < 1.5 && 
                        Math.abs(obs.position.z - player.position.z) < 2 && 
                        !isSliding && player.position.y < 3) {
                        gameOver();
                    }

                    if (obs.position.z > 10) {
                        scene.remove(obs);
                        obstacles.splice(i, 1);
                    }
                }

                // Mover as moedas
                for (let i = coins.length - 1; i >= 0; i--) {
                    let coin = coins[i];
                    coin.position.z += speed;
                    coin.rotation.z += 0.1; // Efeito de girar

                    // Coletar Moeda
                    if (Math.abs(coin.position.x - player.position.x) < 1 && 
                        Math.abs(coin.position.z - player.position.z) < 1 && 
                        player.position.y < 2) {
                        scene.remove(coin);
                        coins.splice(i, 1);
                        score += 50; // Bônus por moeda
                    }

                    if (coin.position.z > 10) {
                        scene.remove(coin);
                        coins.splice(i, 1);
                    }
                }
            }

            renderer.render(scene, camera);
        }

        // Game Over
        function gameOver() {
            isGameOver = true;
            document.getElementById('final-score').innerText = Math.floor(score / 10);
            document.getElementById('game-over').style.display = 'flex';
        }

        function restartGame() {
            isGameOver = false;
            score = 0;
            speed = 0.4;
            currentLane = 1;
            isJumping = false;
            player.position.set(0, 1, 0);
            player.scale.y = 1;
            
            obstacles.forEach(obs => scene.remove(obs));
            coins.forEach(coin => scene.remove(coin));
            obstacles = [];
            coins = [];

            document.getElementById('game-over').style.display = 'none';
            document.getElementById('score').innerText = "0";
        }

        // Loop que gera os obstáculos
        setInterval(spawnObstacle, 1500);
        setInterval(spawnCoin, 800);

        // Ajustar tela ao redimensionar
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
